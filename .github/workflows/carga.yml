# S3 pasos 3 a 6 · carga histórica por mes con reversa y setval, el delta del mismo día (ADR 0013 y 0016; criterios
# 4, 5, 6, 7, 8 y 12 del plan), la paridad de estado con el oráculo del corte (ADR 0014 y 0015; criterios 2 y 9) y las
# trampas latentes con el plan variado (ADR 0011; criterio 2).
# Fuera del ruleset: hacerlos requeridos lo decide el dueño del repo. El mismo patrón que mutacion.yml:
# - en cada PR, 3 meses (el primero, el de la grieta UTC y el último), cada uno ensayo → aplicar (huella del mes
#   origen = destino) → reversa (huella previa), y los controles negativos, que tienen que FALLAR donde se dice;
# - en cada PR también (job `delta`), el delta del mismo día sobre la base CERRADA: la que volcó la última nocturna,
#   restaurada (si no hay volcado vigente, la construye), con sus 6 controles negativos;
# - en cada PR también (job `estado`), la paridad de estado de los 8 escritores sobre el respaldo (transacciones
#   revertidas, contra el TO-BE en la base cerrada) y el oráculo capturado en el congelamiento contra el TO-BE en la base
#   cerrada con el delta, con sus controles negativos y las 6 trampas observables;
# - en cada PR, cada noche y a mano (job `latentes`), las 2 trampas latentes con las variantes del plan en la copia
#   temporal del respaldo, contra sí mismas y contra el TO-BE en la base cerrada (en el PR, lo pesado en muestra);
# - cada noche (y a mano), los 36 meses acumulando (aplicar, reversa y aplicar otra vez), el cierre y los mismos
#   controles; luego la base cerrada se vuelca (artefacto `destino-cerrado`) y el delta corre sobre ESE volcado
#   restaurado.
# Origen: el respaldo FECHADO del ciclo restaurado como BFN_DIVISAS_CORTE (y, para el delta, el legado vivo); destino:
# PostgreSQL limpio por corrida.
name: carga

on:
  pull_request:
  schedule:
    - cron: '23 8 * * *'   # cada noche: los 36 meses
  workflow_dispatch:
    inputs:
      meses:
        description: "'todos' (36, acumulando, con cierre), 'pr' (los 3 del PR) o meses AAAA-MM separados por comas"
        default: todos

permissions:
  contents: read

jobs:
  carga:
    name: carga por mes con reversa y setval (S3, no requerida todavía)
    runs-on: ubuntu-latest
    # El PR tiene que caber en 15 min junto con lo demás; de noche son 36 meses.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 120 }}
    env:
      DECANT_PG_PUERTO: '15460'
      MESES: ${{ github.event_name == 'pull_request' && 'pr' || inputs.meses || 'todos' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: contraseñas por corrida (sa del legado y PostgreSQL del destino)
        run: |
          clave="Dc1-$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$clave"
          echo "DECANT_SA_PASSWORD=$clave" >> "$GITHUB_ENV"
          pg="$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$pg"
          echo "DECANT_PG_PASSWORD=$pg" >> "$GITHUB_ENV"
      # El legado del ciclo (el mismo de S1 y de la paridad): deja el respaldo fechado y su manifiesto.
      - name: ciclo completo del legado
        run: ./ciclo.sh
      # Imagen fija por digest y tope de memoria de 1 GB (la carga es por mes, no el estado completo).
      - name: PostgreSQL del destino (imagen fija por digest)
        run: |
          docker run -d --name decant-pg-carga --memory 1g -e POSTGRES_USER=decant \
            -e POSTGRES_PASSWORD="$DECANT_PG_PASSWORD" -p "127.0.0.1:$DECANT_PG_PUERTO:5432" \
            postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
          for _ in $(seq 1 60); do
            if docker exec decant-pg-carga pg_isready -h 127.0.0.1 -U decant -q &&
               docker exec decant-pg-carga psql -h 127.0.0.1 -U decant -tAc 'SELECT 1' | grep -qx 1; then
              exit 0
            fi
            sleep 1
          done
          docker logs decant-pg-carga
          exit 1
      # Con los 36 meses, además, la base cerrada se vuelca (pg_dump) a corte/base/ si todo cuadró.
      - name: la carga por mes y sus controles negativos (corte/carga_ci.py)
        run: |
          set -o pipefail      # el shell del paso es `bash -e`: sin esto, tee taparía una carga en rojo
          mkdir -p corte/carga-ci
          volcar=()
          if [ "$MESES" = todos ]; then volcar=(--volcar corte/base --contenedor decant-pg-carga); fi
          python -m corte.carga_ci --meses "$MESES" --salida corte/carga-ci --resumen "$GITHUB_STEP_SUMMARY" \
            "${volcar[@]}" 2>&1 | tee corte/carga-ci/carga.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: carga-por-mes
          path: |
            corte/carga-ci/
            respaldos/*.json
      # La base cerrada como foto restaurable: el delta del PR la restaura (≈ 2 min) en vez de cargar los 36 meses.
      # Ya viene comprimida (pg_dump -Fc): el zip del artefacto no la comprime otra vez.
      - name: la base cerrada, volcada (artefacto destino-cerrado)
        if: ${{ !cancelled() && hashFiles('corte/base/destino.dump') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: destino-cerrado
          path: corte/base/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      # Cada noche el delta corre sobre ESE volcado restaurado en otra base: la segunda línea de defensa probada.
      - name: el delta del mismo día sobre la base restaurada del volcado (corte/delta_ci.py)
        if: ${{ !cancelled() && hashFiles('corte/base/destino.dump') != '' }}
        run: |
          set -o pipefail
          mkdir -p corte/delta-ci
          python -m corte.delta_ci --base corte/base --contenedor decant-pg-carga --destino-base decant_corte_delta \
            --fuente "esta misma corrida ($GITHUB_RUN_ID)" --salida corte/delta-ci --resumen "$GITHUB_STEP_SUMMARY" \
            2>&1 | tee corte/delta-ci/delta.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && hashFiles('corte/delta-ci/delta.json') != '' }}
        with:
          name: delta-del-dia
          path: corte/delta-ci/
      # Memoria pico de cada contenedor (cgroup v2: memory.peak) contra su tope.
      - name: memoria pico
        if: always()
        run: |
          for c in $(docker ps -q --filter name=decant); do
            id=$(docker inspect -f '{{.Id}}' "$c"); nombre=$(docker inspect -f '{{.Name}}' "$c")
            tope=$(docker inspect -f '{{.HostConfig.Memory}}' "$c")
            pico=/sys/fs/cgroup/system.slice/docker-$id.scope/memory.peak
            if [ -r "$pico" ]; then
              echo "$nombre: pico $(( $(cat "$pico") / 1048576 )) MiB · tope $(( tope / 1048576 )) MiB"
            else
              echo "$nombre: memory.peak no disponible · tope $(( tope / 1048576 )) MiB"
            fi
          done
          free -m
      - name: apagar el legado y PostgreSQL
        if: always()
        run: |
          docker compose -f legado/docker-compose.yml down -v
          docker rm -f -v decant-pg-carga || true
          docker ps -aq --filter name=decant-radiografia- | xargs -r docker rm -f

  # S3 paso 4 · el delta del mismo día sobre la base CERRADA (criterios 5, 7, 8 y 12), en cada PR. La base es el volcado
  # (pg_dump) que dejó la última nocturna de main (o, mientras no la haya, la de esta rama lanzada a mano): se
  # restaura, que es la segunda línea de defensa del ADR 0013, y se verifica sin creerle. Si no hay volcado vigente, el
  # job la construye (36 meses y cierre, ≈ 7 min más). Luego el delta con sus 6 controles negativos (corte/delta_ci.py).
  delta:
    name: delta del mismo día sobre la base cerrada (S3, no requerida todavía)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read          # hallar y bajar el volcado de otra corrida de este workflow
    env:
      DECANT_PG_PUERTO: '15470'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: contraseñas por corrida (sa del legado y PostgreSQL del destino)
        run: |
          clave="Dc1-$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$clave"
          echo "DECANT_SA_PASSWORD=$clave" >> "$GITHUB_ENV"
          pg="$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$pg"
          echo "DECANT_PG_PASSWORD=$pg" >> "$GITHUB_ENV"
      # La corrida más reciente (nocturna o a mano) que dejó un volcado vigente: primero main, luego esta rama.
      - name: el volcado de la base cerrada más reciente
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          RAMA: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          for rama in main "$RAMA"; do
            corridas=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/carga.yml/runs" \
              -f branch="$rama" -f status=completed -f per_page=30 \
              --jq '.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch") | .id')
            for corrida in $corridas; do
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$corrida/artifacts" \
                --jq '[.artifacts[] | select(.name == "destino-cerrado" and .expired == false)] | length')
              if [ "$n" -gt 0 ]; then
                echo "corrida=$corrida" >> "$GITHUB_OUTPUT"
                echo "fuente=volcado de la corrida $corrida ($rama)" >> "$GITHUB_OUTPUT"
                echo "volcado de la corrida $corrida ($rama)"
                exit 0
              fi
            done
          done
          echo "fuente=sin volcado vigente: construida aquí" >> "$GITHUB_OUTPUT"
          echo "no hay volcado vigente: la base se construye en este job"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.base.outputs.corrida != ''
        with:
          name: destino-cerrado
          path: corte/base
          run-id: ${{ steps.base.outputs.corrida }}
          github-token: ${{ github.token }}
      - name: ciclo completo del legado
        run: ./ciclo.sh
      - name: PostgreSQL del destino (imagen fija por digest)
        run: |
          docker run -d --name decant-pg-delta --memory 1g -e POSTGRES_USER=decant \
            -e POSTGRES_PASSWORD="$DECANT_PG_PASSWORD" -p "127.0.0.1:$DECANT_PG_PUERTO:5432" \
            postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
          for _ in $(seq 1 60); do
            if docker exec decant-pg-delta pg_isready -h 127.0.0.1 -U decant -q &&
               docker exec decant-pg-delta psql -h 127.0.0.1 -U decant -tAc 'SELECT 1' | grep -qx 1; then
              exit 0
            fi
            sleep 1
          done
          docker logs decant-pg-delta
          exit 1
      - name: el delta del mismo día y sus controles negativos (corte/delta_ci.py)
        env:
          FUENTE: ${{ steps.base.outputs.fuente }}
        run: |
          set -o pipefail      # el shell del paso es `bash -e`: sin esto, tee taparía un delta en rojo
          mkdir -p corte/delta-ci
          construir=()
          if [ ! -f corte/base/destino.dump ]; then construir=(--construir-base); fi
          python -m corte.delta_ci --base corte/base "${construir[@]}" --contenedor decant-pg-delta \
            --fuente "$FUENTE" --salida corte/delta-ci --resumen "$GITHUB_STEP_SUMMARY" 2>&1 | tee corte/delta-ci/delta.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: delta-del-dia
          path: |
            corte/delta-ci/
            corte/base/destino.json
            respaldos/*.json
      - name: memoria pico
        if: always()
        run: |
          for c in $(docker ps -q --filter name=decant); do
            id=$(docker inspect -f '{{.Id}}' "$c"); nombre=$(docker inspect -f '{{.Name}}' "$c")
            tope=$(docker inspect -f '{{.HostConfig.Memory}}' "$c")
            pico=/sys/fs/cgroup/system.slice/docker-$id.scope/memory.peak
            if [ -r "$pico" ]; then
              echo "$nombre: pico $(( $(cat "$pico") / 1048576 )) MiB · tope $(( tope / 1048576 )) MiB"
            else
              echo "$nombre: memory.peak no disponible · tope $(( tope / 1048576 )) MiB"
            fi
          done
          free -m
      - name: apagar el legado y PostgreSQL
        if: always()
        run: |
          docker compose -f legado/docker-compose.yml down -v
          docker rm -f -v decant-pg-delta || true
          docker ps -aq --filter name=decant-radiografia- | xargs -r docker rm -f

  # S3 paso 5 · paridad de ESTADO de los que escriben y ORÁCULO del corte para los que leen (ADR 0014 y 0015; criterios 2
  # y 9), en cada PR. Reusa el volcado `destino-cerrado` (el estado inicial del TO-BE: el mismo que el respaldo) y el
  # delta del paso 4 (aplicado a una copia: el estado del congelamiento). El ciclo corre con DECANT_ORACULO=1: el
  # legado vivo captura el oráculo EN el congelamiento (el job `legado`, que observa el ciclo para la puerta, no lo
  # enciende). Los 8 escritores corren en una copia temporal del respaldo (esquema `estado`, reloj inyectado), cada
  # escenario en una transacción revertida con la guarda de @@TRANCOUNT (corte/estado_ci.py).
  estado:
    name: paridad de estado y oráculo del corte (S3, no requerida todavía)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read          # hallar y bajar el volcado de otra corrida de este workflow
    env:
      DECANT_PG_PUERTO: '15480'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: contraseñas por corrida (sa del legado y PostgreSQL del destino)
        run: |
          clave="Dc1-$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$clave"
          echo "DECANT_SA_PASSWORD=$clave" >> "$GITHUB_ENV"
          pg="$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$pg"
          echo "DECANT_PG_PASSWORD=$pg" >> "$GITHUB_ENV"
      # La corrida más reciente (nocturna o a mano) que dejó un volcado vigente: primero main, luego esta rama.
      - name: el volcado de la base cerrada más reciente
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          RAMA: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          for rama in main "$RAMA"; do
            corridas=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/carga.yml/runs" \
              -f branch="$rama" -f status=completed -f per_page=30 \
              --jq '.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch") | .id')
            for corrida in $corridas; do
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$corrida/artifacts" \
                --jq '[.artifacts[] | select(.name == "destino-cerrado" and .expired == false)] | length')
              if [ "$n" -gt 0 ]; then
                echo "corrida=$corrida" >> "$GITHUB_OUTPUT"
                echo "fuente=volcado de la corrida $corrida ($rama)" >> "$GITHUB_OUTPUT"
                echo "volcado de la corrida $corrida ($rama)"
                exit 0
              fi
            done
          done
          echo "fuente=sin volcado vigente: construida aquí" >> "$GITHUB_OUTPUT"
          echo "no hay volcado vigente: la base se construye en este job"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.base.outputs.corrida != ''
        with:
          name: destino-cerrado
          path: corte/base
          run-id: ${{ steps.base.outputs.corrida }}
          github-token: ${{ github.token }}
      # El oráculo se captura dentro del legado vivo, en el congelamiento (legado/datos/oraculo_<fecha>.json).
      - name: ciclo completo del legado, con el oráculo del corte en el congelamiento
        env:
          DECANT_ORACULO: '1'
        run: ./ciclo.sh
      - name: PostgreSQL del destino (imagen fija por digest)
        run: |
          docker run -d --name decant-pg-estado --memory 1g -e POSTGRES_USER=decant \
            -e POSTGRES_PASSWORD="$DECANT_PG_PASSWORD" -p "127.0.0.1:$DECANT_PG_PUERTO:5432" \
            postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
          for _ in $(seq 1 60); do
            if docker exec decant-pg-estado pg_isready -h 127.0.0.1 -U decant -q &&
               docker exec decant-pg-estado psql -h 127.0.0.1 -U decant -tAc 'SELECT 1' | grep -qx 1; then
              exit 0
            fi
            sleep 1
          done
          docker logs decant-pg-estado
          exit 1
      - name: la paridad de estado, el oráculo y sus controles negativos (corte/estado_ci.py)
        env:
          FUENTE: ${{ steps.base.outputs.fuente }}
        run: |
          set -o pipefail      # el shell del paso es `bash -e`: sin esto, tee taparía una corrida en rojo
          mkdir -p corte/estado-ci
          construir=()
          if [ ! -f corte/base/destino.dump ]; then construir=(--construir-base); fi
          # /usr/bin/time -v deja la memoria pico (RSS) del proceso
          medir=()
          if [ -x /usr/bin/time ]; then medir=(/usr/bin/time -v -o corte/estado-ci/memoria.txt); fi
          "${medir[@]}" python -m corte.estado_ci --base corte/base "${construir[@]}" --contenedor decant-pg-estado \
            --fuente "$FUENTE" --salida corte/estado-ci --resumen "$GITHUB_STEP_SUMMARY" 2>&1 \
            | tee corte/estado-ci/estado.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: paridad-de-estado
          path: |
            corte/estado-ci/
            legado/datos/oraculo_*.json
            legado/datos/vivo_*.json
            corte/base/destino.json
            respaldos/*.json
      - name: memoria pico
        if: always()
        run: |
          for c in $(docker ps -q --filter name=decant); do
            id=$(docker inspect -f '{{.Id}}' "$c"); nombre=$(docker inspect -f '{{.Name}}' "$c")
            tope=$(docker inspect -f '{{.HostConfig.Memory}}' "$c")
            pico=/sys/fs/cgroup/system.slice/docker-$id.scope/memory.peak
            if [ -r "$pico" ]; then
              echo "$nombre: pico $(( $(cat "$pico") / 1048576 )) MiB · tope $(( tope / 1048576 )) MiB"
            else
              echo "$nombre: memory.peak no disponible · tope $(( tope / 1048576 )) MiB"
            fi
          done
          grep -E 'Maximum resident set size|Elapsed' corte/estado-ci/memoria.txt || true
          free -m
      - name: apagar el legado y PostgreSQL
        if: always()
        run: |
          docker compose -f legado/docker-compose.yml down -v
          docker rm -f -v decant-pg-estado || true
          docker ps -aq --filter name=decant-radiografia- | xargs -r docker rm -f

  # S3 paso 6 · las trampas LATENTES (r1-T1, r2-T2) con el plan VARIADO (ADR 0011 y 0014; criterio 2). Reusa el arnés
  # del paso 5: la copia temporal del respaldo (esquema `estado`, verificada igual al original y borrada al terminar),
  # la guarda de @@TRANCOUNT y el volcado `destino-cerrado` como TO-BE. Cada variante (tal cual, la caché repetida,
  # MAXDOP 4, MAXDOP 1, el lote suelto, las forzadas y estadísticas recalculadas con la caché de la copia vacía) corre
  # SÓLO en la copia; su plan real sale de la caché (corte/latentes_ci.py). En el PR, lo pesado (el lote suelto de
  # r1-T1, que recorre la tabla por cada par) va en muestra; de noche y a mano, sobre todo el universo.
  latentes:
    name: trampas latentes con el plan variado (S3, no requerida todavía)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 75 }}
    permissions:
      contents: read
      actions: read          # hallar y bajar el volcado de otra corrida de este workflow
    env:
      DECANT_PG_PUERTO: '15490'
      ALCANCE: ${{ github.event_name == 'pull_request' && 'pr' || 'completo' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: contraseñas por corrida (sa del legado y PostgreSQL del destino)
        run: |
          clave="Dc1-$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$clave"
          echo "DECANT_SA_PASSWORD=$clave" >> "$GITHUB_ENV"
          pg="$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$pg"
          echo "DECANT_PG_PASSWORD=$pg" >> "$GITHUB_ENV"
      # La corrida más reciente (nocturna o a mano) que dejó un volcado vigente: primero main, luego esta rama.
      - name: el volcado de la base cerrada más reciente
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          for rama in main "$RAMA"; do
            corridas=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/carga.yml/runs" \
              -f branch="$rama" -f status=completed -f per_page=30 \
              --jq '.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch") | .id')
            for corrida in $corridas; do
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$corrida/artifacts" \
                --jq '[.artifacts[] | select(.name == "destino-cerrado" and .expired == false)] | length')
              if [ "$n" -gt 0 ]; then
                echo "corrida=$corrida" >> "$GITHUB_OUTPUT"
                echo "fuente=volcado de la corrida $corrida ($rama)" >> "$GITHUB_OUTPUT"
                echo "volcado de la corrida $corrida ($rama)"
                exit 0
              fi
            done
          done
          echo "fuente=sin volcado vigente: construida aquí" >> "$GITHUB_OUTPUT"
          echo "no hay volcado vigente: la base se construye en este job"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.base.outputs.corrida != ''
        with:
          name: destino-cerrado
          path: corte/base
          run-id: ${{ steps.base.outputs.corrida }}
          github-token: ${{ github.token }}
      - name: ciclo completo del legado
        run: ./ciclo.sh
      - name: PostgreSQL del destino (imagen fija por digest)
        run: |
          docker run -d --name decant-pg-latentes --memory 1g -e POSTGRES_USER=decant \
            -e POSTGRES_PASSWORD="$DECANT_PG_PASSWORD" -p "127.0.0.1:$DECANT_PG_PUERTO:5432" \
            postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
          for _ in $(seq 1 60); do
            if docker exec decant-pg-latentes pg_isready -h 127.0.0.1 -U decant -q &&
               docker exec decant-pg-latentes psql -h 127.0.0.1 -U decant -tAc 'SELECT 1' | grep -qx 1; then
              exit 0
            fi
            sleep 1
          done
          docker logs decant-pg-latentes
          exit 1
      - name: las latentes con el plan variado y sus controles (corte/latentes_ci.py)
        env:
          FUENTE: ${{ steps.base.outputs.fuente }}
        run: |
          set -o pipefail      # el shell del paso es `bash -e`: sin esto, tee taparía una corrida en rojo
          mkdir -p corte/latentes-ci
          construir=()
          if [ ! -f corte/base/destino.dump ]; then construir=(--construir-base); fi
          completo=()
          if [ "$ALCANCE" = completo ]; then completo=(--completo); fi
          # /usr/bin/time -v deja la memoria pico (RSS) del proceso
          medir=()
          if [ -x /usr/bin/time ]; then medir=(/usr/bin/time -v -o corte/latentes-ci/memoria.txt); fi
          "${medir[@]}" python -m corte.latentes_ci --base corte/base "${construir[@]}" "${completo[@]}" \
            --contenedor decant-pg-latentes --fuente "$FUENTE" --salida corte/latentes-ci \
            --resumen "$GITHUB_STEP_SUMMARY" 2>&1 | tee corte/latentes-ci/latentes.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: latentes-plan-variado
          path: |
            corte/latentes-ci/
            corte/base/destino.json
            respaldos/*.json
      - name: memoria pico
        if: always()
        run: |
          for c in $(docker ps -q --filter name=decant); do
            id=$(docker inspect -f '{{.Id}}' "$c"); nombre=$(docker inspect -f '{{.Name}}' "$c")
            tope=$(docker inspect -f '{{.HostConfig.Memory}}' "$c")
            pico=/sys/fs/cgroup/system.slice/docker-$id.scope/memory.peak
            if [ -r "$pico" ]; then
              echo "$nombre: pico $(( $(cat "$pico") / 1048576 )) MiB · tope $(( tope / 1048576 )) MiB"
            else
              echo "$nombre: memory.peak no disponible · tope $(( tope / 1048576 )) MiB"
            fi
          done
          grep -E 'Maximum resident set size|Elapsed' corte/latentes-ci/memoria.txt || true
          free -m
      - name: apagar el legado y PostgreSQL
        if: always()
        run: |
          docker compose -f legado/docker-compose.yml down -v
          docker rm -f -v decant-pg-latentes || true
          docker ps -aq --filter name=decant-radiografia- | xargs -r docker rm -f
