# Legado ficticio: SQL Server 2022 Developer con la base BFN_DIVISAS (y su job en msdb).
#   DECANT_SA_PASSWORD=... docker compose -f legado/docker-compose.yml up -d --wait
name: decant-legado
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
    container_name: ${DECANT_CONTENEDOR:-decant-legado}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DECANT_SA_PASSWORD:?define DECANT_SA_PASSWORD}
      # El servidor del legado vive en hora local: GETDATE() devuelve la hora de la Ciudad de México.
      TZ: America/Mexico_City
      # El job existe en msdb (se inventaría), pero el Agent queda apagado: con el reloj real dispararía la regla
      # de vencimiento (GETDATE() - 3 días) sobre datos de 2023 y vencería todo lo pendiente. Ver docs/adr/0001.
      MSSQL_AGENT_ENABLED: "false"
      MSSQL_MEMORY_LIMIT_MB: "3072"
    # Tope del contenedor por encima del de SQL Server (3 GB): el CI tiene 16 GB para todo el job de paridad.
    mem_limit: 4g
    ports:
      - "127.0.0.1:${DECANT_PUERTO:-14330}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
