# Configuración de pytest (Decant no se publica como paquete: no hay pyproject.toml).
[pytest]
testpaths = tests
# Los proyectos .NET viven también en tests/: pytest no entra a sus carpetas de compilación.
norecursedirs = bin obj Decant.*
# La raíz del repo en sys.path: el CI corre `pytest` (no `python -m pytest`, que agrega el directorio actual).
pythonpath = .
# Las pruebas de integración necesitan el legado en Docker: el CI las corre aparte con `-m integracion`.
addopts = -ra --strict-markers -m "not integracion and not paridad"
markers =
    integracion: necesita el legado en SQL Server (docker compose), el respaldo y el informe de la radiografía
    paridad: necesita el informe de `python -m paridad` (legado del ciclo + TO-BE en PostgreSQL)
